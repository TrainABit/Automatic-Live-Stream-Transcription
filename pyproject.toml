[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "livestream-transcriber"
version = "0.1.0"
description = "Real-time transcription of live streams with pluggable local or cloud speech-to-text, event rules and notifiers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Florian Groß" }]
keywords = ["transcription", "live-stream", "speech-to-text", "whisper", "yt-dlp", "hls"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Typing :: Typed",
]
dependencies = [
    "yt-dlp",
    "numpy>=1.26",
    "pydantic>=2.5",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Local speech-to-text on CPU (default provider).
local = ["faster-whisper>=1.0,<2"]
# Local ONNX models (Parakeet, Moonshine) through sherpa-onnx.
onnx = ["sherpa-onnx>=1.10"]
# The OpenAI-compatible providers use the standard library only; the extra
# exists so `pip install livestream-transcriber[openai]` reads naturally.
openai = []
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
lst = "livestream_transcriber.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/livestream_transcriber"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF012",  # mutable class attributes: dataclass/pydantic defaults are handled by the libraries
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "SIM117"]

[tool.ruff.lint.isort]
known-first-party = ["livestream_transcriber"]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_defs = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["yt_dlp", "yt_dlp.*", "faster_whisper", "faster_whisper.*", "sherpa_onnx", "sherpa_onnx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
timeout = 60
markers = [
    "slow: runs a real ffmpeg process (still offline); opt in with LST_RUN_SLOW=1 or -m slow",
    "network: needs the public internet; opt in with LST_RUN_NETWORK=1 or -m network",
]
